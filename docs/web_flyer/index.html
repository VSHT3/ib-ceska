<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Private Bilingual High School Česká 10 and IB Diploma Programme brochure"
    />
    <title>Česká High School — IB Diploma Programme</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #eaf4f7;
        color: #24343a;
        font-family: Arial, Helvetica, sans-serif;
      }
      header {
        padding: 18px 20px;
        text-align: center;
        background: linear-gradient(90deg, #0872aa, #04a9c7);
        color: white;
      }
      header h1 {
        margin: 0;
        font-size: clamp(1.15rem, 2.5vw, 1.8rem);
      }
      header p {
        margin: 6px 0 0;
        font-size: 0.95rem;
      }
      main {
        padding: 22px 12px 40px;
      }
      .brochure {
        width: min(100%, 920px);
        margin: 0 auto;
        display: grid;
        gap: 22px;
      }
      .page {
        display: block;
        width: 100%;
        height: auto;
        background: white;
        box-shadow: 0 8px 28px rgba(0, 74, 99, 0.15);
      }
      footer {
        padding: 18px;
        text-align: center;
        color: #49626b;
        font-size: 0.85rem;
      }
      @media (max-width: 600px) {
        main {
          padding: 10px 5px 24px;
        }
        .brochure {
          gap: 10px;
        }
        header {
          padding: 13px 10px;
        }
      }
      @media print {
        header,
        footer {
          display: none;
        }
        main {
          padding: 0;
        }
        .brochure {
          width: 100%;
          gap: 0;
        }
        .page {
          box-shadow: none;
          break-after: page;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Česká High School — IB Diploma Programme</h1>
      <p>Bratislava · Slovakia · International Education</p>
    </header>
    <main>
      <section class="brochure" aria-label="School brochure">
        <img
          class="page"
          src="assets/page-1.webp"
          alt="Brochure page 1: school and IB Diploma Programme overview"
        />
        <img
          class="page"
          src="assets/page-2.webp"
          alt="Brochure page 2: IB programme information and student learning activities"
        />
        <img
          class="page"
          src="assets/page-3.webp"
          alt="Brochure page 3: international education, student pathways and school facilities"
        />
        <img
          class="page"
          src="assets/page-4.webp"
          alt="Brochure page 4: history, heritage and alumni"
        />
      </section>
    </main>
    <footer>Private Bilingual High School Česká 10, Bratislava</footer>
  </body>
</html>
